<!doctype html><html><head><meta charset="utf-8"><title>Hippocampus · memory graph</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>body{margin:0;background:#0b0f1a;color:#cde;font:14px system-ui}#g{position:absolute;inset:0 340px 0 0}#p{position:absolute;right:0;top:0;bottom:0;width:320px;padding:10px;overflow:auto;background:#111827}
input,button{background:#1f2937;color:#cde;border:1px solid #374151;padding:6px;margin:2px 0;width:100%;box-sizing:border-box}pre{white-space:pre-wrap;font-size:12px}</style></head>
<body><div id="g"></div><div id="p"><h3>🧠 Hippocampus</h3>
<input id="t" placeholder="remember…"><button onclick="post('remember',{text:t.value,salience:+s.value})">remember</button>
<input id="s" type="number" min="0" max="1" step="0.1" value="0.3" title="salience">
<input id="c" placeholder="recall cue…"><button onclick="post('recall',{cue:c.value})">recall</button>
<button onclick="post('sleep',{})">😴 sleep</button><button onclick="fetch('/api/preview').then(r=>r.text()).then(t=>out.textContent=t)">🔍 preview pass</button><button onclick="post('timeskip',{days:7})">⏩ +7 days</button>
<pre id="st"></pre><pre id="out"></pre>
<p>Tier colours: <span style="color:#60a5fa">hot (plain/LZ4)</span> · <span style="color:#a78bfa">warm (zstd+dict, lossless)</span> · <span style="color:#f472b6">cool (schema+residual ≥0.90)</span> · <span style="color:#6b7280">cold (gist+key residuals ≥0.65)</span> · ◆ semantic</p></div>
<script>
const C=['#60a5fa','#a78bfa','#f472b6','#6b7280'];const nodes=new vis.DataSet(),edges=new vis.DataSet();
const net=new vis.Network(g,{nodes,edges},{physics:{stabilization:false},nodes:{font:{color:'#cde'}},edges:{color:'#334155'}});
async function refresh(){const d=await (await fetch('/api/graph')).json();
 nodes.update(d.nodes.map(n=>({id:n.id,label:n.label+'\n'+n.enc,shape:n.kind==='semantic'?'diamond':'dot',size:8+20*n.retention,color:C[n.tier]})));
 const ids=new Set(d.nodes.map(n=>n.id));nodes.getIds().filter(i=>!ids.has(i)).forEach(i=>nodes.remove(i));
 edges.clear();edges.add(d.edges.map(e=>({id:e.from+e.to,from:e.from,to:e.to,width:1+5*e.w})));
 const S=await (await fetch('/api/stats')).json();st.style.color=S.overBudget?'#f87171':'';st.textContent=JSON.stringify(S,null,1);}
async function post(p,b){const r=await (await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)})).json();out.textContent=JSON.stringify(r,null,1);refresh();}
new EventSource('/api/events').onmessage=e=>{const ev=JSON.parse(e.data);if(ev.type!=='recall')return refresh();
 const a=ev.activation;nodes.update(Object.keys(a).map(id=>({id,color:{background:'#fde047',border:ev.winners.includes(id)?'#fff':'#fde047'},borderWidth:ev.winners.includes(id)?4:1,opacity:Math.max(.3,a[id])})));
 setTimeout(refresh,2500);};
refresh();
</script></body></html>
