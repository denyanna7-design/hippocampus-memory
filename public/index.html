<!doctype html><html><head><meta charset="utf-8"><title>Hippocampus · memory graph</title>
<!-- Self-contained: custom 60 fps canvas renderer + force layout, no external libraries or CDNs. -->
<style>html,body{height:100%;margin:0}body{background:#05070d;color:#cde;font:14px system-ui;overflow:hidden}#cv{position:absolute;left:0;top:0}
#p{position:absolute;right:0;top:0;bottom:0;width:320px;padding:12px;overflow:auto;background:linear-gradient(#0f1522f2,#0b1020f2);border-left:1px solid #1f2937;backdrop-filter:blur(6px)}
h3{margin:4px 0 10px;letter-spacing:.02em}input,button{background:#1f2937;color:#cde;border:1px solid #374151;border-radius:7px;padding:6px;margin:2px 0;width:100%;box-sizing:border-box;transition:background .2s,box-shadow .2s}
button:hover{background:#273449;box-shadow:0 0 12px #a78bfa44}.row{display:flex;gap:4px}.row>*{flex:1}
pre{white-space:pre-wrap;font-size:11px;max-height:30vh;overflow:auto;background:#0b1020;border-radius:6px;padding:6px;margin:6px 0}
#st{background:#0b1020;border-radius:9px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.55;border:1px solid #1f2937;transition:all .6s}
#st.over{border-color:#f87171;background:#2a0f14;color:#fecaca;animation:pulse 1.3s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 28px #f8717166}50%{box-shadow:0 0 6px #f8717122}}
#st b{color:#fff}.k{color:#94a3b8}#legend{margin-top:10px;font-size:11.5px;color:#94a3b8}#grad{height:10px;border-radius:5px;margin:4px 0;background:linear-gradient(90deg,#60a5fa,#a78bfa 33%,#f472b6 66%,#6b7280)}
#legend .l{display:flex;justify-content:space-between}#cap{position:absolute;left:16px;top:12px;color:#94a3b8;font-size:13px;letter-spacing:.02em;text-shadow:0 1px 4px #000}
#hud{position:absolute;left:calc(50% - 160px);top:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1);
 background:#070a12d9;border:1px solid #a78bfa66;border-radius:16px;padding:16px 28px 30px;min-width:420px;text-align:center;box-shadow:0 0 60px #a78bfa40,inset 0 0 30px #a78bfa14;backdrop-filter:blur(4px)}
#hud.on{opacity:1;transform:translate(-50%,-50%) scale(1)}#hud .t{font-size:14px;color:#c4b5fd;letter-spacing:.18em;text-transform:uppercase}
#hud .n{font:700 46px ui-monospace,DejaVu Sans Mono,monospace;color:#fff;margin:6px 0;text-shadow:0 0 18px #a78bfa}#hud .s{font-size:14px;color:#94a3b8}
#bars{display:flex;gap:20px;justify-content:center;margin-top:30px;height:80px;align-items:flex-end}#bars div{width:40px;border-radius:5px 5px 0 0;position:relative;transition:height 1.3s cubic-bezier(.2,.9,.2,1.15),filter .6s}
#bars em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:600 12px ui-monospace,monospace;color:#e5e7eb;font-style:normal}#bars span{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:11px;color:#94a3b8}
#phase{position:absolute;left:calc(50% - 160px);top:9%;transform:translateX(-50%);font:600 18px system-ui;letter-spacing:.3em;color:#e9d5ff;text-transform:uppercase;opacity:0;transition:opacity .4s;text-shadow:0 0 16px #a78bfa}</style></head>
<body><canvas id="cv"></canvas><div id="cap">brain view: recalled memories, schemas ◆ and important memories are labelled (hover a node for details)</div><div id="phase"></div>
<div id="hud"><div class="t" id="ht"></div><div class="n" id="hn">0 B</div><div class="s" id="hs"></div><div id="bars"></div></div>
<div id="p"><h3>🧠 Hippocampus</h3>
<input id="t" placeholder="remember…"><div class="row"><input id="s" type="number" min="0" max="1" step="0.1" value="0.3" title="salience"><button onclick="post('remember',{text:t.value,salience:+s.value})">remember</button></div>
<input id="c" placeholder="recall cue…"><button id="rb" onclick="post('recall',{cue:c.value})">recall</button>
<div class="row"><button id="sb" onclick="sleepAnim()">😴 sleep</button><button onclick="fetch('/api/preview').then(r=>r.text()).then(t=>out.textContent=t)">🔍 preview pass</button></div>
<button id="kb" onclick="skipAnim()">⏩ +7 days</button>
<div id="st"></div><pre id="out"></pre>
<div id="legend">retention → storage tier<div id="grad"></div><div class="l"><span>hot</span><span>warm · lossless</span><span>cool ≥0.90</span><span>cold ≥0.65</span></div>◆ schema (prototype, always lossless)</div></div>
<script>
const TC=['#60a5fa','#a78bfa','#f472b6','#6b7280'];const cv=document.getElementById('cv'),X=cv.getContext('2d');let W=0,H=0,DPR=Math.min(2,devicePixelRatio||1);
function resize(){W=innerWidth-320;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px'}addEventListener('resize',resize);resize();
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`,lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2,easeOut=t=>1-(1-t)**3;
// ---------- state ----------
const N=new Map();let E=[],S={},busy=false,lit=new Set(),hover=null;const cam={x:0,y:0,z:1,tx:0,ty:0,tz:1};
const parts=[],bursts=[];let starLayers=[];
function mkStars(){starLayers=[.15,.35,.6].map((d,i)=>({d,s:[...Array(70+i*30)].map(()=>({x:Math.random()*2400-1200,y:Math.random()*1600-800,r:Math.random()*1.4+.3,tw:Math.random()*6}))}))}mkStars();
// ---------- force layout ----------
function tick(alpha){const ns=[...N.values()];
 for(let i=0;i<ns.length;i++){const a=ns[i];for(let j=i+1;j<ns.length;j++){const b=ns[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01;if(d2>90000)continue;const f=900/d2*alpha;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}}
 for(const e of E){const a=N.get(e.from),b=N.get(e.to);if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,L=e.schema?55:85,k=(e.schema?.06:.025*e.w)*alpha*(d-L)/d;a.vx+=dx*k;a.vy+=dy*k;b.vx-=dx*k;b.vy-=dy*k}
 for(const n of ns){if(n.pin){n.vx=n.vy=0;continue}n.vx-=n.x*.004*alpha;n.vy-=n.y*.004*alpha;if(n.fold){n.vx+=(n.fold.x-n.x)*.08;n.vy+=(n.fold.y-n.y)*.08}n.vx*=.82;n.vy*=.82;n.x+=n.vx;n.y+=n.vy}}
// ---------- data ----------
const kb=b=>b>=1024?(b/1024).toFixed(1)+' KB':Math.round(b)+' B';
function label(n){return lit.has(n.id)||n.kind==='semantic'||n.salience>=.7}
function targetR(n){return (n.kind==='semantic'?9:4)+11*n.retention+(n.salience>=.7?4:0)}
async function stats(){S=await (await fetch('/api/stats')).json();st.className=S.overBudget?'over':'';
 st.innerHTML=`<b>${S.memories}</b> memories · <b>${S.schemas}</b> schemas<br><span class=k>content</span> <b>${kb(S.storedBytes)}</b> for ${kb(S.rawBytes)} raw (<b>${S.compressionRatio}×</b>)<br>`+
 `<span class=k>index</span> ${kb(S.indexBytes)} · <span class=k>dictionary</span> ${kb(S.dictionaryBytes)}<br><span class=k>total on disk</span> <b>${S.totalBytes} B</b>${S.budgetBytes?` / budget <b>${S.budgetBytes} B</b>`:''}<br>`+
 `<span class=k>tiers</span> ${S.tiers.map((t,i)=>`<span style="color:${TC[i]}">${t.tier} ${t.nodes}</span>`).join(' · ')}<br><span class=k>lossy</span> ${S.lossyMemories} · min fidelity ${S.minFidelity} · <b>unrecoverable ${S.unrecoverable}</b>`+
 (S.overBudget?'<br>⚠️ <b>OVER BUDGET</b>: nothing deleted, asking the user':'');return S}
async function refresh(){const d=await (await fetch('/api/graph')).json();const first=!N.size;const seen=new Set();
 for(const m of d.nodes){seen.add(m.id);let n=N.get(m.id);const col=hex(TC[m.tier]);
  if(!n){const nb=d.edges.find(e=>e.from===m.id&&N.has(e.to)||e.to===m.id&&N.has(e.from));const o=nb?N.get(nb.from===m.id?nb.to:nb.from):null;
   n={id:m.id,x:o?o.x+Math.random()*40-20:Math.random()*300-150,y:o?o.y+Math.random()*40-20:Math.random()*300-150,vx:0,vy:0,r:first?targetR(m):0,c:col,c0:col,c1:col,ct:1,flash:0};N.set(m.id,n);
   if(!first)bursts.push({x:n.x,y:n.y,t0:performance.now(),c:col,ms:900})}
  if(n.c1.join()!==col.join()){n.c0=n.c.slice();n.c1=col;n.ct=0}
  Object.assign(n,{m,tr:targetR(m)})}
 for(const id of [...N.keys()])if(!seen.has(id))N.delete(id);
 E=d.edges.filter(e=>e.w>=.1);for(const m of d.nodes)if(m.schema&&N.has(m.schema))E.push({from:m.id,to:m.schema,w:.6,schema:1});
 if(first){for(let i=0;i<500;i++)tick(1-i/600);fit(true)}await stats()}
function fit(now){const ns=[...N.values()];if(!ns.length)return;let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const n of ns){a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x);d=Math.max(d,n.y)}
 cam.tx=(a+c)/2;cam.ty=(b+d)/2;cam.tz=Math.min(1.8,.86*Math.min(W/(c-a+80),H/(d-b+80)));if(now){cam.x=cam.tx;cam.y=cam.ty;cam.z=cam.tz}}
async function post(p,b){const r=await (await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)})).json();out.textContent=r.report??r.text??JSON.stringify(r,null,1);if(!busy)refresh();return r}
// ---------- recall: particle pulses with trails + camera zoom ----------
function spread(a,winners){lit=new Set(winners);const t0=performance.now();const act=Object.entries(a).filter(([k])=>N.has(k)).sort((x,y)=>y[1]-x[1]);if(!act.length)return;
 const seeds=act.filter(([,v])=>v>=.85).map(([k])=>k).slice(0,4);if(!seeds.length)seeds.push(act[0][0]);const when={};seeds.forEach(s=>when[s]=0);let fr=[...seeds],hop=0;
 const adj=id=>E.filter(e=>e.from===id||e.to===id).map(e=>e.from===id?e.to:e.from);
 while(fr.length&&hop<3){const nx=[];for(const f of fr)for(const j of adj(f)){if(when[j]!==undefined||(hop>0&&a[j]===undefined))continue;when[j]=(hop+1)*700;nx.push(j);
   for(let k=0;k<3;k++)parts.push({from:f,to:j,t0:t0+hop*700+k*90,ms:700,trail:[],hot:a[j]!==undefined})}fr=nx.slice(0,40);hop++}
 for(const[id,t]of Object.entries(when))setTimeout(()=>{const n=N.get(id);if(!n)return;n.flash=1;bursts.push({x:n.x,y:n.y,t0:performance.now(),c:[253,224,71],ms:1000})},t);
 const top=N.get(act[0][0]);cam.tx=top.x;cam.ty=top.y+20;cam.tz=Math.min(2.1,cam.z*1.5);
 setTimeout(()=>{lit=new Set();fit();refresh()},9000)}
// ---------- render ----------
let last=performance.now();
function frame(now){const dt=Math.min(50,now-last);last=now;if(!busyLayout)tick(.08);
 const k=1-Math.pow(.0025,dt/1000);cam.x=lerp(cam.x,cam.tx,k);cam.y=lerp(cam.y,cam.ty,k);cam.z=lerp(cam.z,cam.tz,k);
 X.setTransform(DPR,0,0,DPR,0,0);const bg=X.createRadialGradient(W*.45,H*.5,0,W*.45,H*.5,Math.max(W,H)*.8);bg.addColorStop(0,'#131a30');bg.addColorStop(1,'#04060b');X.fillStyle=bg;X.fillRect(0,0,W,H);
 // parallax stars
 for(const L of starLayers){for(const s of L.s){const x=((s.x-cam.x*L.d)%W+W*1.5)%W,y=((s.y-cam.y*L.d)%H+H*1.5)%H;X.fillStyle=`rgba(180,190,255,${(.25+.25*Math.sin(now/900+s.tw))*L.d*1.6})`;X.fillRect(x,y,s.r*L.d*2,s.r*L.d*2)}}
 // hippocampus motif: a glowing seahorse-like C-curve behind the graph
 X.save();X.translate(W/2-(cam.x*.25),H/2-(cam.y*.25));X.globalCompositeOperation='lighter';X.lineWidth=26;X.strokeStyle='rgba(167,139,250,.035)';X.beginPath();
 for(let i=0;i<=120;i++){const t=i/120,a=Math.PI*(.15+1.55*t),r=lerp(240,95,t)*(1+.05*Math.sin(now/1400+t*6));const x=Math.cos(a)*r*1.25,y=Math.sin(a)*r-40+t*80;i?X.lineTo(x,y):X.moveTo(x,y)}X.stroke();
 X.lineWidth=2;X.strokeStyle='rgba(196,181,253,.10)';X.stroke();const mt=(now/5000)%1,ma=Math.PI*(.15+1.55*mt),mr=lerp(240,95,mt);X.fillStyle='rgba(233,213,255,.35)';X.beginPath();X.arc(Math.cos(ma)*mr*1.25,Math.sin(ma)*mr-40+mt*80,3,0,7);X.fill();X.restore();
 // world
 X.save();X.translate(W/2,H/2);X.scale(cam.z,cam.z);X.translate(-cam.x,-cam.y);
 X.lineWidth=1/cam.z;for(const e of E){const a=N.get(e.from),b=N.get(e.to);if(!a||!b)continue;X.strokeStyle=e.schema?'rgba(167,139,250,.16)':`rgba(100,116,160,${.12+.35*e.w})`;X.beginPath();X.moveTo(a.x,a.y);X.lineTo(b.x,b.y);X.stroke()}
 X.globalCompositeOperation='lighter';
 for(const p of parts){const a=N.get(p.from),b=N.get(p.to);if(!a||!b)continue;const t=(now-p.t0)/p.ms;if(t<0)continue;const e=easeOut(Math.min(1,t));const x=lerp(a.x,b.x,e),y=lerp(a.y,b.y,e);
  if(t<=1)p.trail.push([x,y]);if(p.trail.length>14||t>1)p.trail.shift();for(let i=1;i<p.trail.length;i++){X.strokeStyle=`rgba(253,224,71,${i/p.trail.length*.55})`;X.lineWidth=(1+i/3)/cam.z*1.2;X.beginPath();X.moveTo(...p.trail[i-1]);X.lineTo(...p.trail[i]);X.stroke()}
  if(t<=1){const g=X.createRadialGradient(x,y,0,x,y,14);g.addColorStop(0,'rgba(255,255,230,1)');g.addColorStop(.3,'rgba(253,224,71,.8)');g.addColorStop(1,'rgba(253,224,71,0)');X.fillStyle=g;X.beginPath();X.arc(x,y,14,0,7);X.fill()}}
 for(let i=parts.length-1;i>=0;i--)if(now-parts[i].t0>parts[i].ms+400)parts.splice(i,1);
 for(const b of bursts){const t=(now-b.t0)/b.ms;if(t<0||t>1)continue;X.strokeStyle=rgb(b.c,.8*(1-t));X.lineWidth=2.5/cam.z;X.beginPath();X.arc(b.x,b.y,6+46*easeOut(t),0,7);X.stroke()}
 for(let i=bursts.length-1;i>=0;i--)if(now-bursts[i].t0>bursts[i].ms)bursts.splice(i,1);
 for(const n of N.values()){n.ct=Math.min(1,n.ct+dt/1300);n.c=n.c0.map((v,i)=>lerp(v,n.c1[i],ease(n.ct)));const tr=n.squash?n.tr*n.squash:n.tr;n.r=lerp(n.r,tr,1-Math.pow(.004,dt/1000));n.flash=Math.max(0,n.flash-dt/2600);
  const c=lit.has(n.id)||n.flash>0?n.c.map((v,i)=>lerp(v,[253,224,71][i],Math.max(lit.has(n.id)?.85:0,n.flash))):n.c;const R=n.r*(1+.6*n.flash);
  const g=X.createRadialGradient(n.x,n.y,0,n.x,n.y,R*3.2);g.addColorStop(0,rgb(c,.55));g.addColorStop(1,rgb(c,0));X.fillStyle=g;X.beginPath();X.arc(n.x,n.y,R*3.2,0,7);X.fill()}
 X.globalCompositeOperation='source-over';
 for(const n of N.values()){const c=lit.has(n.id)||n.flash>0?n.c.map((v,i)=>lerp(v,[253,224,71][i],Math.max(lit.has(n.id)?.85:0,n.flash))):n.c;const R=n.r*(1+.6*n.flash);X.fillStyle=rgb(c);X.beginPath();
  if(n.m.kind==='semantic'){X.moveTo(n.x,n.y-R*1.3);X.lineTo(n.x+R*1.3,n.y);X.lineTo(n.x,n.y+R*1.3);X.lineTo(n.x-R*1.3,n.y);X.closePath()}else X.arc(n.x,n.y,R,0,7);X.fill();
  if(lit.has(n.id)){X.strokeStyle='#fff';X.lineWidth=2.5/cam.z;X.stroke()}
}
 X.restore();drawLabels();requestAnimationFrame(frame)}
// ---------- labels: screen space, priority order, collision avoidance, safe area ----------
const SAFE={top:36,bottom:112,side:10};
function drawLabels(){const zoomed=lit.size>0;const cand=[];
 for(const n of N.values()){let pr=hover===n?5:lit.has(n.id)?4:0;if(!zoomed&&!pr)pr=n.m.salience>=.7?2:n.m.kind==='semantic'?1:0;if(!pr)continue;cand.push({n,pr})}
 cand.sort((a,b)=>b.pr-a.pr||b.n.r-a.n.r);const placed=[];X.font='600 13px system-ui';X.textBaseline='middle';
 const hit=r=>r.x<SAFE.side||r.x+r.w>W-SAFE.side||r.y<SAFE.top||r.y+r.h>H-SAFE.bottom||placed.some(q=>r.x<q.x+q.w&&r.x+r.w>q.x&&r.y<q.y+q.h&&r.y+r.h>q.y);
 for(const {n,pr} of cand){const sx=(n.x-cam.x)*cam.z+W/2,sy=(n.y-cam.y)*cam.z+H/2,R=n.r*cam.z;const t=n.m.label;const w=X.measureText(t).width+12,h=20;
  const opts=[[sx-w/2,sy+R+4],[sx-w/2,sy-R-4-h],[sx+R+6,sy-h/2],[sx-R-6-w,sy-h/2]];let r=null;
  for(const [x,y] of opts){const q={x,y,w,h};if(!hit(q)){r=q;break}}if(!r)continue;placed.push(r);
  X.fillStyle=pr>=4?'rgba(40,32,4,.78)':'rgba(4,6,11,.72)';X.beginPath();X.roundRect(r.x,r.y,r.w,r.h,6);X.fill();
  X.fillStyle=pr>=4?'#fef9c3':'#cbd5e1';X.textAlign='center';X.fillText(t,r.x+r.w/2,r.y+h/2+.5);
  if(hover===n){X.font='11px system-ui';X.fillStyle='#94a3b8';X.fillText(`${n.m.enc} · retention ${n.m.retention}${n.m.lossy?' · lossy':''}`,r.x+r.w/2,r.y+h+9);X.font='600 13px system-ui'}}}
let busyLayout=false;requestAnimationFrame(frame);
cv.addEventListener('mousemove',ev=>{const x=(ev.offsetX-W/2)/cam.z+cam.x,y=(ev.offsetY-H/2)/cam.z+cam.y;hover=null;for(const n of N.values())if(Math.hypot(n.x-x,n.y-y)<n.r+4)hover=n});
// ---------- HUD: byte counter + morphing per-tier bars ----------
function hud(title,from,to,sub,before,after,ms=2400){ht.textContent=title;hs.textContent=sub;hud_.className='on';const mx=Math.max(2,...after.map(t=>t.ratio||0),...before.map(t=>t.ratio||0))*1.1;
 bars.innerHTML=before.map((t,i)=>`<div style="background:linear-gradient(${TC[i]},${TC[i]}66);height:${Math.max(4,80*(t.ratio||0)/mx)}px;box-shadow:0 0 14px ${TC[i]}88"><em>${(t.ratio||0).toFixed(1)}×</em><span>${t.tier}</span></div>`).join('');
 setTimeout(()=>[...bars.children].forEach((b,i)=>{b.style.height=Math.max(4,80*(after[i].ratio||0)/mx)+'px';const em=b.querySelector('em');const r0=before[i].ratio||0,r1=after[i].ratio||0,t0=performance.now();
  (function f(n){const t=Math.min(1,(n-t0)/1300);em.textContent=lerp(r0,r1,easeOut(t)).toFixed(1)+'×';if(t<1)requestAnimationFrame(f)})(t0)}),400);
 const t0=performance.now();(function step(n){const t=Math.min(1,(n-t0)/ms);hn.textContent=Math.round(lerp(from,to,easeOut(t)))+' B';if(t<1)requestAnimationFrame(step)})(t0);
 setTimeout(()=>hud_.className='',ms+2600)}
const hud_=document.getElementById('hud');const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
function setPhase(t){phase.textContent=t;phase.style.opacity=t?1:0}
// ---------- sleep: replay → fold into schemas → condense ----------
async function sleepAnim(){busy=true;const before=await stats();await refresh();
 setPhase('replay');const eps=[...N.values()].filter(n=>n.m.kind!=='semantic').sort((a,b)=>a.m.createdAt-b.m.createdAt);const step=Math.max(18,1500/eps.length);
 for(const n of eps){n.flash=1;bursts.push({x:n.x,y:n.y,t0:performance.now(),c:[233,213,255],ms:600});await sleepMs(step)}
 setPhase('consolidate');for(const n of N.values()){const s=n.m.schema&&N.get(n.m.schema);if(s){const a=Math.atan2(n.y-s.y,n.x-s.x),d=Math.max(26,Math.min(70,Math.hypot(n.x-s.x,n.y-s.y)*.45));n.fold={x:s.x+Math.cos(a)*d,y:s.y+Math.sin(a)*d}}}
